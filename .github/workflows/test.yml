# Runs the tests on every push to main and every pull request, on a Mac, with
# the real sing-box core (the tests drive it with made-up nodes).
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch the core and the rule sets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/fetch-singbox.sh
          ./scripts/fetch-rulesets.sh
      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet .
      - name: Test, with the race detector
        # The engine's start, stop and proxy switching run on goroutines of
        # their own; the race detector is what keeps them honest.
        run: go test ./... -count=1 -race
